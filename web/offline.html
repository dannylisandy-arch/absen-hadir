<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("absen:tema")||"terang";if(t!=="auto")document.documentElement.setAttribute("data-theme",t==="gelap"?"dark":"light")}catch(e){}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#13213C">
<title>Tidak ada koneksi · Absensi Hadir</title>
<style>
:root{--ink:#13213C;--paper:#EEF2F0;--muted:#5B6878}
@media (prefers-color-scheme:dark){:root{--ink:#E8EEF3;--paper:#0F1726;--muted:#9AA8BC}}
html,body{height:100%}
body{margin:0;display:grid;place-items:center;background:var(--paper);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px;box-sizing:border-box}
img{width:72px;height:72px;border-radius:18px}
h1{font-size:1.4rem;margin:18px 0 6px}
p{color:var(--muted);margin:0 0 22px;max-width:320px;line-height:1.5}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 28px;background:var(--ink);color:var(--paper);cursor:pointer}
</style>
</head>
<body>
<main>
  <img src="icons/icon-192.png" alt="">
  <h1>Tidak ada koneksi internet</h1>
  <p>Absensi butuh internet untuk mencatat jam dan lokasi. Periksa data seluler atau Wi-Fi, lalu coba lagi.</p>
  <button onclick="location.reload()">Coba lagi</button>
</main>
</body>
</html>
